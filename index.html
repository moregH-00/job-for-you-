<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة عمل مصغرة - إصدار متقدم</title>  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>  <style>
    body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
    header{background:#111827;padding:15px;text-align:center;font-size:22px;font-weight:bold}
    .container{max-width:1000px;margin:auto;padding:20px}
    .card{background:#1f2937;padding:20px;border-radius:12px;margin-top:15px}
    input,button,select{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:none;font-size:15px}
    button{background:#3b82f6;color:white;cursor:pointer}
    button:hover{background:#2563eb}
    .hidden{display:none}
    .job,.box{background:#111827;padding:12px;border-radius:10px;margin-top:10px}
    .small{font-size:12px;opacity:.7}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  </style></head>
<body><header>منصة عمل مصغرة - Pro</header><div class="container">  <!-- AUTH -->  <div class="card" id="authCard">
    <h3>تسجيل / دخول</h3>
    <input id="email" placeholder="Email" />
    <input id="pass" type="password" placeholder="Password" />
    <button onclick="login()">دخول</button>
  </div>  <!-- PROFILE -->  <div class="card hidden" id="profileCard">
    <h3>ملفك الشخصي</h3>
    <input id="name" placeholder="الاسم" />
    <input id="bio" placeholder="نبذة" />
    <button onclick="saveProfile()">حفظ</button>
  </div>  <!-- ROLE -->  <div class="card hidden" id="roleCard">
    <h3>اختر دورك</h3>
    <button onclick="setRole('worker')">موظف</button>
    <button onclick="setRole('employer')">صاحب عمل</button>
  </div>  <!-- EMPLOYER -->  <div class="card hidden" id="employerDash">
    <h3>نشر وظيفة</h3>
    <input id="jobTitle" placeholder="العنوان" />
    <input id="jobTime" placeholder="الوقت" />
    <input id="jobPay" placeholder="الأجر" />
    <input id="jobTags" placeholder="مهارات (مثال: بيع,تنظيف)" />
    <button onclick="postJob()">نشر</button><h3>طلبات التوظيف</h3>
<div id="apps"></div>

  </div>  <!-- WORKER -->  <div class="card hidden" id="workerDash">
    <h3>الوظائف المتاحة</h3>
    <input id="search" placeholder="بحث عن وظيفة..." oninput="loadJobs()" />
    <div id="jobs"></div>
  </div>  <!-- CHAT -->  <div class="card hidden" id="chatBox">
    <h3>الدردشة</h3>
    <input id="msg" placeholder="رسالة" />
    <button onclick="sendMsg()">إرسال</button>
    <div id="msgs"></div>
  </div></div><script>
const firebaseConfig={
  apiKey:"YOUR_API_KEY",
  authDomain:"YOUR_PROJECT.firebaseapp.com",
  projectId:"YOUR_PROJECT"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

let role="";
let currentUser=null;
let activeJob=null;

// AUTH
function login(){
  auth.signInWithEmailAndPassword(email.value,pass.value)
  .catch(()=>auth.createUserWithEmailAndPassword(email.value,pass.value))
  .then(()=>{
    authCard.classList.add("hidden");
    profileCard.classList.remove("hidden");
  });
}

// PROFILE
function saveProfile(){
  db.collection("users").doc(auth.currentUser.uid).set({
    name:name.value,
    bio:bio.value
  });
  profileCard.classList.add("hidden");
  roleCard.classList.remove("hidden");
}

// ROLE
function setRole(r){
  role=r;
  db.collection("users").doc(auth.currentUser.uid).update({role});

  roleCard.classList.add("hidden");
  chatBox.classList.remove("hidden");

  if(role=="employer") employerDash.classList.remove("hidden");
  else workerDash.classList.remove("hidden");

  loadJobs();
}

// JOBS
function postJob(){
  db.collection("jobs").add({
    title:jobTitle.value,
    time:jobTime.value,
    pay:jobPay.value,
    tags:jobTags.value,
    owner:auth.currentUser.uid
  });
}

function loadJobs(){
  db.collection("jobs").onSnapshot(s=>{
    jobs.innerHTML="";
    let keyword=search.value.toLowerCase();

    s.forEach(d=>{
      let j=d.data();

      if(keyword && !j.title.toLowerCase().includes(keyword) && !j.tags?.toLowerCase().includes(keyword)) return;

      jobs.innerHTML+=`
        <div class='job'>
          <b>${j.title}</b>
          <p>${j.time}</p>
          <p>${j.pay}</p>
          <p class='small'>${j.tags}</p>
          <button onclick="applyJob('${d.id}')">تقديم</button>
          <button onclick="openChat('${d.id}')">دردشة</button>
        </div>
      `;
    });
  });
}

// APPLY
function applyJob(id){
  db.collection("applications").add({
    jobId:id,
    userId:auth.currentUser.uid,
    status:"pending"
  });
  db.collection("notifications").add({
    text:"طلب جديد على وظيفة",
    jobId:id
  });
}

// APPLICATIONS
function loadApps(){
  db.collection("applications").onSnapshot(s=>{
    apps.innerHTML="";
    s.forEach(d=>{
      let a=d.data();
      apps.innerHTML+=`
        <div class='box'>
          <p>${a.jobId}</p>
          <p class='small'>${a.status}</p>
          <button onclick="updateApp('${d.id}','accepted')">قبول</button>
          <button onclick="updateApp('${d.id}','rejected')">رفض</button>
        </div>
      `;
    });
  });
}

function updateApp(id,status){
  db.collection("applications").doc(id).update({status});
}

// CHAT PER JOB
function openChat(jobId){
  activeJob=jobId;
  chatBox.classList.remove("hidden");
  loadMsgs();
}

function sendMsg(){
  if(!activeJob) return;

  db.collection("messages").add({
    jobId:activeJob,
    text:msg.value,
    from:auth.currentUser.uid
  });
}

function loadMsgs(){
  db.collection("messages").onSnapshot(s=>{
    msgs.innerHTML="";
    s.forEach(d=>{
      let m=d.data();
      if(m.jobId!==activeJob) return;
      msgs.innerHTML+=`<div class='box'>${m.text}</div>`;
    });
  });
}

// AUTH STATE
auth.onAuthStateChanged(u=>{
  if(u) currentUser=u;
});

</script></body>
</html>
