<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOBY FAST - توظيف فوري</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .hero-bg {
      background: linear-gradient(135deg, #1e40af 0%, #312e81 50%, #4f46e5 100%);
    }
    .glass {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
    }
    .card {
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card:hover {
      transform: scale(1.04) translateY(-8px);
    }
  </style>
</head>
<body class="bg-gray-50">

  <!-- Navbar -->
  <nav class="bg-white/95 backdrop-blur-md shadow-lg sticky top-0 z-50 border-b">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-3xl flex items-center justify-center text-white text-3xl font-black shadow-inner">G</div>
        <h1 class="text-3xl font-bold tracking-tight">GOBY FAST</h1>
      </div>
      <div class="flex gap-8 text-lg font-medium">
        <a href="#" class="hover:text-blue-600 transition">الوظائف</a>
        <a href="#" class="hover:text-blue-600 transition">لأصحاب العمل</a>
        <a href="#" class="hover:text-blue-600 transition">عن المنصة</a>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <div class="hero-bg text-white min-h-screen flex items-center relative overflow-hidden">
    <div class="absolute inset-0 bg-[url('https://picsum.photos/1920/1080')] opacity-10 bg-cover"></div>
    <div class="max-w-7xl mx-auto px-6 py-20 relative z-10">
      <div class="grid md:grid-cols-2 gap-16 items-center">
        <div>
          <span class="inline-block bg-white/20 text-white text-sm font-medium px-5 py-2 rounded-full mb-6">🚀 متوفر الآن في الرياض • جدة • الدمام</span>
          <h1 class="text-6xl md:text-7xl font-black leading-tight mb-6">
            وظيفة اليوم، <span class="text-yellow-300">فلوس اليوم</span>
          </h1>
          <p class="text-2xl text-blue-100 mb-10">
            أسرع منصة توظيف في السعودية للمشاريع الصغيرة والكبيرة
          </p>
          
          <form id="registerForm" class="glass p-8 rounded-3xl max-w-lg">
            <input type="email" id="email" placeholder="بريدك الإلكتروني" 
                   class="w-full px-6 py-6 rounded-2xl text-lg bg-white text-gray-900 focus:outline-none mb-4">
            <button type="submit" 
                    class="w-full bg-gradient-to-r from-yellow-400 to-amber-500 text-gray-900 font-bold text-2xl py-6 rounded-2xl hover:scale-105 transition">
              ابدأ مجاناً الآن
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Role Selection -->
  <div id="roleSelection" class="hidden py-24 bg-white">
    <div class="max-w-6xl mx-auto px-6 text-center">
      <h2 class="text-5xl font-bold mb-6">كيف تريد تستخدم GOBY FAST؟</h2>
      <div class="grid md:grid-cols-2 gap-10 max-w-5xl mx-auto mt-16">
        
        <div onclick="selectRole('employee')" class="card bg-white border border-gray-200 hover:border-blue-500 rounded-3xl p-12 cursor-pointer group">
          <i class="fa-solid fa-user text-8xl text-blue-600 mb-8 group-active:scale-110 transition"></i>
          <h3 class="text-4xl font-bold mb-3">أبحث عن وظيفة</h3>
          <p class="text-gray-600 text-xl">وظائف يومية، جزئية، ودائمة</p>
        </div>

        <div onclick="selectRole('employer')" class="card bg-white border border-gray-200 hover:border-emerald-500 rounded-3xl p-12 cursor-pointer group">
          <i class="fa-solid fa-briefcase text-8xl text-emerald-600 mb-8 group-active:scale-110 transition"></i>
          <h3 class="text-4xl font-bold mb-3">أريد موظفين</h3>
          <p class="text-gray-600 text-xl">انشر وظيفتك واستقبل طلبات فورية</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.querySelector('.hero-bg').classList.add('hidden');
      document.getElementById('roleSelection').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    function selectRole(role) {
      const messages = {
        employee: "🎉 تم تسجيلك كـ <b>موظف</b>!\n\nيمكنك الآن تصفح الوظائف المتاحة",
        employer: "🏪 تم تسجيلك كـ <b>صاحب عمل</b>!\n\nهل تريد نشر وظيفتك الأولى الآن؟"
      };
      alert(messages[role]);
    }
  </script>
</body>
</html>
